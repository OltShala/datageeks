# Receply LOCAL - tunnel demo.receply.net -> this PC. Only these paths get through; everything else answers 404:
#   /webhooks/whatsapp/...           Meta's WhatsApp webhook -> local Chatwoot
#   /webhook/receply-demo-payment    the demo payment page's server -> local n8n (needs the X-Receply-Key header)
#   /webhooks/instagram              Meta's Instagram webhook -> local Chatwoot
#   /instagram/callback              Instagram login when connecting the inbox in Chatwoot
tunnel: e021c1f1-abb7-4dfd-ae12-7e0e3d1503fe
credentials-file: /etc/cloudflared/creds/e021c1f1-abb7-4dfd-ae12-7e0e3d1503fe.json
ingress:
  - hostname: demo.receply.net
    path: ^/webhooks/whatsapp/
    service: http://rails:3000
  - hostname: demo.receply.net
    path: ^/webhook/receply-demo-payment$
    service: http://n8n:5678
  - hostname: demo.receply.net
    path: ^/webhooks/instagram
    service: http://rails:3000
  - hostname: demo.receply.net
    path: ^/instagram/callback
    service: http://rails:3000
  - service: http_status:404